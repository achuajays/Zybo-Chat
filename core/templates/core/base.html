{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zybo Chat{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@latest/font/lucide.min.css">
    {% block extra_css %}{% endblock %}
</head>

<body>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}

    <script>
        // Global Presence & Status Updates
        document.addEventListener('DOMContentLoaded', function () {
            if (!{{ request.user.is_authenticated | yesno: "true,false" }
        }) return;

        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const statusSocket = new WebSocket(
            wsProtocol + window.location.host + '/ws/status/'
        );

        statusSocket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            if (data.type === 'user_status') {
                // Dispatch global event for pages to handle
                window.dispatchEvent(new CustomEvent('user_status_change', {
                    detail: {
                        userId: data.user_id,
                        isOnline: data.is_online
                    }
                }));
            }
        };

        statusSocket.onclose = function (e) {
            console.log('Status socket closed.');
        };
        });
    </script>
</body>

</html>
